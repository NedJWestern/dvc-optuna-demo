[project]
name = "dvc-optuna-demo"
version = "0.1.0"
description = "A minimal DVC training pipeline, tuned by yellowfin"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.0",
    "ipython>=9.17.1",
    "joblib",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "yellowfin",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
yellowfin = { path = "../yellowfin", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
